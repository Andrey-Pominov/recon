# The whole pair: the ledger (built from its repository) and this service following its outbox.
services:
  ledger-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: ledger, POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ledger"], interval: 2s, timeout: 2s, retries: 15 }

  ledger:
    build: https://github.com/Andrey-Pominov/ledger.git#main
    environment:
      ConnectionStrings__Ledger: Host=ledger-db;Port=5432;Database=ledger;Username=ledger;Password=ledger
    ports:
      - "${LEDGER_PORT:-8088}:8080"
    # the aspnet image has no curl; bash can open a TCP socket and read the status line
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      ledger-db: { condition: service_healthy }

  recon-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: recon, POSTGRES_USER: recon, POSTGRES_PASSWORD: recon }
    ports:
      - "${RECON_PG_PORT:-5434}:5432"
    volumes:
      - recon-pgdata:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U recon"], interval: 2s, timeout: 2s, retries: 15 }

  recon:
    build: .
    environment:
      ConnectionStrings__Recon: Host=recon-db;Port=5432;Database=recon;Username=recon;Password=recon
      Ledger__BaseUrl: http://ledger:8080
      Recon__IntervalMinutes: "60"
    ports:
      - "${RECON_PORT:-8090}:8080"
    depends_on:
      recon-db: { condition: service_healthy }
      ledger: { condition: service_healthy }      # the worker syncs on start; the ledger must be answering by then

volumes:
  recon-pgdata:
